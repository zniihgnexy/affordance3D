# Week 1 as one notebook: every notebook of Monday 9 to Sunday 15 November 2026 (London time), outputs kept.
#
#   python scripts/merge_notebooks.py --config configs/report/week1.yaml
#
# The parts are read from source_commit (the last commit that still had them as separate files); they were removed from
# the working tree when this notebook was made. The weekly summary was generated on Monday 16 November but covers this
# week, so it opens this notebook. Work before 9 November (from 29 October) has documents only, no notebook.

output: report/week1_2026-11-09_to_11-15.ipynb
title: "第 1 周：2026-11-09（周一）到 11-15（周日）"
source_commit: 3f2baae
intro: |
  **视频功能记忆（部件级，记忆方向）** · 伦敦时间的自然周，一周只有这一份 notebook · 2026-11-20 整理

  这一周的所有 notebook 都合在这一份里：最前面是 11-16 写的周报（这一周的总结），后面按时间放各个 notebook 的全文。
  每一部分原样并入，图和数字是当时运行的结果，没有重跑。只改了两处：标题降了一级；指向别的 notebook 的链接改成指向本文件里对应的部分。
  原来的单独文件已从仓库里删掉，在提交 `3f2baae` 里还能找到。11-09 以前（10-29 起）的工作只有文档，见 `docs/research/`。
  下一周的内容在 [第 2 周 notebook](week2_2026-11-16_to_11-22.ipynb)。

