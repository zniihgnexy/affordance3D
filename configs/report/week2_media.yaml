# Videos of the week-2 report (report/week2_2026-11-16_to_11-22.ipynb); display only, see report/week2_media.py.
#
#   python scripts/make_week2_media.py --config configs/report/week2_media.yaml

name: week2_media_game   # 2026-11-20: walkthrough, then also the orbit, redrawn game-style (was week2_media, week2_media_interaction)
outputs: runs/report_media
run_config: configs/part_vectors/demo_421069_gravity.yaml   # the part-vector run whose vectors are drawn
variant: [lidar, gravity, best]                              # that run's main variant: inputs only, apart from the oracle masks

walkthrough:
  out: report/assets/week2_walkthrough_421069.mp4
  width: 540             # pixels; the frames are drawn at the working resolution (half the video's) and scaled down
  fps: 12                # the registered frames come about 8.5 times a second, so this plays a little fast
  interaction:           # game-style overlay, report/week2_interaction.py (its docstring lists how each arrow moves)
    colours:             # RGB per action category (Okabe-Ito, colour-blind safe)
      pull: [86, 180, 233]
      push: [230, 159, 0]
      turn: [204, 121, 167]
      open: [0, 158, 115]
    actions:             # SceneFun3D affordance label -> [action name shown, category]
      pinch_pull: [pull, pull]
      hook_pull: [pull, pull]
      unplug: [unplug, pull]
      tip_push: [push, push]
      key_press: [press, push]
      foot_push: [step on, push]
      plug_in: [plug in, push]
      rotate: [rotate, turn]
      hook_turn: [turn, turn]
    swing: [open, open]  # a rotation about an axis off the part (door, window, lid), whatever its label
    objects:             # object name when the part has no task text (a part no task names): affordance label -> name
      rotate: knob
      hook_turn: handle
      hook_pull: handle
      pinch_pull: knob
      key_press: button
      tip_push: button
      foot_push: pedal
      plug_in: socket
      unplug: plug
    swing_min_offset_m: 0.05  # contact at least this far from the memory's axis -> swing; nearer -> twist in place
    alpha: 0.55          # opacity of the part's colour fill at its strongest (it pulses down to 70% with the arrow)
    grow_px: 3           # the part's mask is grown by this many pixels (working resolution) so that small handles show
    min_pixels: 30       # a part is drawn when at least this many of its pixels are visible (working resolution)
    period_s: 1.6        # one back-and-forth of an arrow, in seconds of the video
    arrow_m: 0.15        # length of a straight arrow (3D)
    travel_m: 0.07       # how far a straight arrow slides
    arc_radius_m: 0.07   # radius of a turning arrow
    arc_span_deg: 220    # angle the turning arrow covers
    arc_sweep_deg: 70    # how far the turning arrow swings back and forth
    line_px: 6           # arrow thickness (working resolution)
    font_size: 13        # tag text, pixels of the final video
    max_words: 3         # object name: at most this many words, taken from the part's task text
    tag_lines: 2         # object over action
    group_px: 0          # every part has its own tag

orbit:
  out: report/assets/week2_memory_orbit_421069.mp4
  hw: [540, 720]
  frames: 180
  fps: 15
  points: 8000000         # every point of the cropped scan below the cut (about 6 million in 421069)
  cut_above_floor_m: 1.9  # the ceiling and the tops of the walls are left out so that one sees in from above
  elevation_deg: 50
  radius_scale: 0.45
  fov_deg: 55
  depth_tol_m: 0.08       # a part's scan point counts as seen when within this of the drawn scan's depth there
  interaction:            # the walkthrough's overlay settings, with these replaced: the orbit is drawn at its own size
    min_pixels: 4         # parts are a few metres away here, so far fewer pixels
    grow_px: 2
    line_px: 3
    font_size: 12
    tag_lines: 1          # "object > action" on one line: 13 to 15 parts are in view at once here
    group_px: 70          # neighbouring parts with the same object and action share one tag ("knob x4")
