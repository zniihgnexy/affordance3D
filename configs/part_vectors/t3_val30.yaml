# Stage 0, test T3 of the plan agreed on 2026-11-20 (proposal section 13): the part-vector rules on all 30 validation
# scenes, to see whether the motion vectors are good enough for Task 3 to be a candidate benchmark. Same code and
# settings as S0c, only more scenes; LiDAR depth and the best keyframe only (the inputs a robot has). Part masks and
# labels are the annotation (ORACLE): this asks "given the part, is the motion right", not "is the part found".
# CPU only, no model. Fixed before the run, with the predictions below; a different setting needs a new config name.
#
# Only published reference (SceneFun3D paper, Mask3D-FM, TEST split, 85 scenes): AP25 26.5, +M 24.0, +MA 10.2,
# +MAO 8.1. Divided by AP25, a rough "given a found part" rate: type 90.6%, type+axis 38.5%, type+axis+origin 30.6%.
# Rough on purpose: a ratio of APs is not a per-part accuracy, and the split differs.
#
# Predictions (LiDAR, best keyframe, scored parts of all 30 scenes):
#   T3-P1  coverage: the parts never shown by the 40 keyframes are 12% to 22% of the moving parts (S0b 18%, S0c 15%)
#   T3-P2  gravity (types from the labels): +MA between 35% and 60%, +MAO between 28% and 50% (S0b c1 34/30, S0c 52/36)
#   T3-P3  the type is the larger error: oracle_gravity +MA at least 15 points above gravity +MA (S0c +23)
#   T3-P4  door origin stays weak: rotations about an axis off the part, oracle_gravity +MAO at most 30% (S0c 18%)
# Reading (for the benchmark choice, not for the pipeline):
#   - gravity at or above both rough references (+MA 38.5, +MAO 30.6): the vectors are at a level worth comparing;
#     Task 3 stays a candidate, how to compare is settled by the desk check (T4) on published numbers and code
#   - below both: Task 3 waits for a better type (W4); oracle_gravity shows the level once the type is right
#   - in between: unclear, reported as such
#
#   python scripts/run_part_vectors.py --config configs/part_vectors/t3_val30.yaml

